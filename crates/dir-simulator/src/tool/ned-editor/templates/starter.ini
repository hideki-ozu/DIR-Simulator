[General]
network = __PACKAGE__.Main
ned-path = "models"
sim-time-limit = 10ms
metrics-window = 1ms
max-events = 100000000
max-delta-cycles = 1000000
model-profile = "__PROFILE__"
workload = "workload.json"
__MODEL_CONFIG__Main.a.queueCapacity = 64
Main.a.txProcessingDelay = 0ps
Main.a.rxProcessingDelay = 0ps
Main.a.rxFilter = "*"
Main.b.queueCapacity = 64
Main.b.txProcessingDelay = 0ps
Main.b.rxProcessingDelay = 0ps
Main.b.rxFilter = "*"
Main.bus.bitrate = 500kbps
Main.bus.profile = "__PROFILE__"

[Channel Main::a.tx]
delay = 1us
