[General]
network = __PACKAGE__.Main
ned-path = "models"
sim-time-limit = 10ms
metrics-window = 1ms
max-events = 100000000
max-delta-cycles = 1000000
model-profile = "can.cc.multibus.v1"
workload = "workload.json"
model-config = "routing.json"
Main.a.queueCapacity = 64
Main.a.txProcessingDelay = 0ps
Main.a.rxProcessingDelay = 0ps
Main.a.rxFilter = "*"
Main.b.queueCapacity = 64
Main.b.txProcessingDelay = 0ps
Main.b.rxProcessingDelay = 0ps
Main.b.rxFilter = "*"
Main.gw.a.queueCapacity = 64
Main.gw.a.txProcessingDelay = 0ps
Main.gw.a.rxProcessingDelay = 0ps
Main.gw.a.rxFilter = "*"
Main.gw.b.queueCapacity = 64
Main.gw.b.txProcessingDelay = 0ps
Main.gw.b.rxProcessingDelay = 0ps
Main.gw.b.rxFilter = "*"
Main.busA.bitrate = 500kbps
Main.busA.profile = "can.cc.multibus.v1"
Main.busB.bitrate = 500kbps
Main.busB.profile = "can.cc.multibus.v1"

[Channel Main::a.tx]
delay = 1us
