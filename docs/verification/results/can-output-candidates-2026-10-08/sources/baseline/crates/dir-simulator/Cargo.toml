[package]
name = "dir-simulator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Deterministic Classical CAN discrete-event simulator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tiny_http = "=0.12.0"
rustix = { version = "=0.38.44", features = ["fs", "rand"] }

[build-dependencies]
sha2 = "0.10"
