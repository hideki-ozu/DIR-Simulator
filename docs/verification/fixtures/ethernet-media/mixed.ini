[General]
network = media.Mix
ned-path = "models"
model-profile = "ethernet.l2.store-forward.v2"
model-config = "mixed.model.json"
workload = "mixed.workload.json"
sim-time-limit = 100us
[Channel Mix::b.tx]
bitrate = 1Gbps
delay = 1ns
[Channel Mix::sw.tx_b]
bitrate = 1Gbps
delay = 1ns
[Channel Mix::c.tx]
bitrate = 100Mbps
delay = 1ns
[Channel Mix::sw.tx_c]
bitrate = 100Mbps
delay = 1ns
