[General]
network = gw.Main
ned-path = "models"
sim-time-limit = 1ms
model-profile = "can.cc.multibus.v1"
model-config = "delay-routing.json"
workload = "delay-workload.json"
Main.busB.bitrate = 250kbps
Main.src.txProcessingDelay = 3us
Main.gw.a.rxProcessingDelay = 7us
Main.gw.b.txProcessingDelay = 13us
Main.sink.rxProcessingDelay = 7us
[Channel Main::src.tx]
delay = 2us
[Channel Main::busA.tx_b]
delay = 3us
[Channel Main::gw.tx_b]
delay = 2us
[Channel Main::busB.tx_b]
delay = 3us
