<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:575px;height:500px;background:#FFFFFF;" width="575px" height="500px" viewBox="0 0 575 500" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="25"><text x="125.255" y="36.24" fill="#000" font-size="14" textLength="322.825" font-weight="700" font-family="Noto Sans CJK JP">型の既定値とINIによるパラメータ解決（設計案）</text></g><ellipse cx="138" cy="66.272" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="16" y="96.272" width="243.999" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="122.512" fill="#000" font-size="14" textLength="223.999" font-family="Noto Sans CJK JP">NEDの型にあるデフォルト値を取得</text><rect x="44" y="156.544" width="187.999" height="60.544" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="54" y="182.784" fill="#000" font-size="14" textLength="167.999" font-family="Noto Sans CJK JP">インスタンス用に値を複製</text><text x="54" y="203.056" fill="#000" font-size="14" textLength="63.896" font-family="Noto Sans CJK JP">（clone）</text><path d="M268.162,227.088 L268.162,268.631 L248.162,272.631 L268.162,276.631 L268.162,318.175 A0,0 0 0 0 268.162,318.175 L554.335,318.175 A0,0 0 0 0 554.335,318.175 L554.335,237.088 L544.335,227.088 L268.162,227.088 A0,0 0 0 0 268.162,227.088" style="stroke:#D6C77A;stroke-width:0.5;" fill="#FFFBEA"/><path d="M544.335,227.088 L544.335,237.088 L554.335,237.088 L544.335,227.088" style="stroke:#D6C77A;stroke-width:0.5;" fill="#FFFBEA"/><text x="274.162" y="248.328" fill="#000" font-size="14" textLength="251.999" font-family="Noto Sans CJK JP">指定値を優先し、未指定値を保持する。</text><text x="274.162" y="268.599" fill="#000" font-size="14" textLength="265.173" font-family="Noto Sans CJK JP">型・物理量を検証する（DIR-REQ-052）。</text><text x="274.162" y="288.871" fill="#000" font-size="14" textLength="125.999" font-family="Noto Sans CJK JP">記法・単位・丸めは</text><text x="274.162" y="309.143" fill="#000" font-size="14" textLength="237.005" font-family="Noto Sans CJK JP">DIR-TBD-002 / 003 / 004で確定する。</text><rect x="27.837" y="242.36" width="220.325" height="60.544" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="37.837" y="268.599" fill="#000" font-size="14" textLength="200.325" font-family="Noto Sans CJK JP">INIのインスタンス別指定を適用</text><text x="37.837" y="288.871" fill="#000" font-size="14" textLength="69.804" font-family="Noto Sans CJK JP">（merge）</text><rect x="51.427" y="338.175" width="173.145" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="61.427" y="364.415" fill="#000" font-size="14" textLength="153.145" font-family="Noto Sans CJK JP">Resolved ParameterSet</text><rect x="28.432" y="398.447" width="219.135" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="38.432" y="424.687" fill="#000" font-size="14" textLength="199.135" font-family="Noto Sans CJK JP">Module Factoryへ確定値を渡す</text><ellipse cx="138" cy="469.719" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="138" cy="469.719" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="138" y1="76.272" x2="138" y2="96.272" style="stroke:#475569;stroke-width:1;"/><polygon points="134,86.272,138,96.272,142,86.272,138,90.272" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="138" y1="136.544" x2="138" y2="156.544" style="stroke:#475569;stroke-width:1;"/><polygon points="134,146.544,138,156.544,142,146.544,138,150.544" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="138" y1="217.088" x2="138" y2="242.36" style="stroke:#475569;stroke-width:1;"/><polygon points="1