<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:649px;height:1313px;background:#FFFFFF;" width="649px" height="1313px" viewBox="0 0 649 1313" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="25"><text x="150.621" y="36.24" fill="#000" font-size="14" textLength="346.499" font-weight="700" font-family="Noto Sans CJK JP">読み込み・初期化・実行・結果出力の流れ（設計案）</text></g><ellipse cx="200.457" cy="66.272" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="75.059" y="86.272" width="250.797" height="454.175" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M197.058,86.272 L197.058,99.544 L187.058,109.544 L75.059,109.544" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="78.059" y="103.512" fill="#000" font-size="14" textLength="112" font-family="Noto Sans CJK JP">定義・設定の解決</text><rect x="134.059" y="126.544" width="132.798" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="144.059" y="152.784" fill="#000" font-size="14" textLength="112.798" font-family="Noto Sans CJK JP">1. NEDを読み込む</text><rect x="135.438" y="186.816" width="130.04" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="145.438" y="213.056" fill="#000" font-size="14" textLength="110.04" font-family="Noto Sans CJK JP">2. ASTへ解析する</text><rect x="155.058" y="247.088" width="90.798" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="165.058" y="273.328" fill="#000" font-size="14" textLength="70.798" font-family="Noto Sans CJK JP">3. 検証する</text><rect x="119.863" y="307.36" width="161.189" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="129.863" y="333.599" fill="#000" font-size="14" textLength="141.189" font-family="Noto Sans CJK JP">4. Model IRへ解決する</text><rect x="138.896" y="367.631" width="123.124" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="148.896" y="393.871" fill="#000" font-size="14" textLength="103.124" font-family="Noto Sans CJK JP">5. INIを読み込む</text><rect x="85.059" y="427.903" width="230.797" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="95.059" y="454.143" fill="#000" font-size="14" textLength="210.797" font-family="Noto Sans CJK JP">6. パラメータの上書きを適用する</text><rect x="110.665" y="488.175" width="179.585" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="120.665" y="514.415" fill="#000" font-size="14" textLength="159.585" font-family="Noto Sans CJK JP">7. Resolved Modelを作る</text><rect x="16" y="550.447" width="557.74" height="354.175" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M82,550.447 L82,563.719 L72,573.719 L16,573.719" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="567.687" fill="#000" font-size="14" textLength="56" font-family="Noto Sans CJK JP">実行準備</text><rect x="26" y="590.719" width="348.915" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="36" y="616.959" fill="#000" font-size="14" textLength="328.915" font-family="Noto Sans CJK JP">8. Module Registryでsimple moduleの型を解決する</text><rect x="43.612" y="650.991" width="313.691" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="53.612" y="677.231" fill="#000" font-size="14" textLength="293.691" font-family="Noto Sans CJK JP">9. simple moduleのNetworkNodesを生成する</text><rect x="102.174" y="711.263" width="196.567" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="112.174" y="737.503" fill="#000" font-size="14" textLength="176.567" font-family="Noto Sans CJK JP">10. ポート・接続を検証する</text><rect x="46.174" y="771.535" width="308.567" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="56.174" y="797.775" fill="#000" font-size="14" textLength="288.567" font-family="Noto Sans CJK JP">11. 各実行インスタンスを一度だけ初期化する</text><path d="M318.741,821.807 L318.741,853.215 L298.741,857.215 L318.741,861.215 L318.741,892.622 A0,0 0 0 0 318.741,892.622 L563.74,892.622 A0,0 0 0 0 563.74,892.622 L563.74,831.807 L553.74,821.807 L318.741,821.807 A0,0 0 0 0 318.741,821.807" style="stroke:#D6C77A;stroke-width:0.5;" fill="#FFFBEA"/><path d="M553.74,821.807 L553.74,831.807 L563.74,831.807 L553.74,821.807" style="stroke:#D6C77A;stroke-width:0.5;" fill="#FFFBEA"/><text x="324.741" y="843.047" fill="#000" font-size="14" textLength="223.481" font-family="Noto Sans CJK JP">initializeを直接一度ずつ呼び出す。</text><text x="324.741" y="863.319" fill="#000" font-size="14" textLength="223.999" font-family="Noto Sans CJK JP">初期化中の通知もキューへ登録し、</text><text x="324.741" y="883.591" fill="#000" font-size="14" textLength="217.769" font-family="Noto Sans CJK JP">全初期化後に時刻0の処理へ進む。</text><rect x="102.174" y="837.079" width="196.567" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="112.174" y="863.319" fill="#000" font-size="14" textLength="176.567" font-family="Noto Sans CJK JP">12. 初期イベントを登録する</text><rect x="50.174" y="914.622" width="579.566" height="241.496" fill="none" style="stroke:#000;stroke-width:1.5;" rx="4" ry="4"/><path d="M130.174,914.622 L130.174,927.894 L120.174,937.894 L50.174,937.894" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="53.174" y="931.862" fill="#000" font-size="14" textLength="70" font-family="Noto Sans CJK JP">実行・出力</text><path d="M360.741,952.758 L360.741,984.166 L340.741,988.166 L360.741,992.166 L360.741,1023.574 A0,0 0 0 0 360.741,1023.574 L619.74,1023.574 A0,0 0 0 0 619.74,1023.574 L619.74,962.758 L609.74,952.758 L360.741,952.758 A0,0 0 0 0 360.741,952.758" style="stroke:#D6C77A;stroke-width:0.5;" fill="#FFFBEA"/><path d="M609.74,952.758 L609.74,962.758 L619.74,962.758 L609.74,952.758" style="stroke:#D6C77A;stroke-width:0.5;" fill="#FFFBEA"/><text x="366.741" y="973.998" fill="#000" font-size="14" textLength="195.999" font-family="Noto Sans CJK JP">完了・解放、到着、仲裁の順。</text><text x="366.741" y="994.27" fill="#000" font-size="14" textLength="233.897" font-family="Noto Sans CJK JP">実行区間は[0,T)、正常観測終端はT。</text><text x="366.741" y="1014.542" fill="#000" font-size="14" textLength="237.999" font-family="Noto Sans CJK JP">計測規則は結果詳細仕様を適用する。</text><rect x="60.174" y="957.894" width="280.567" height="60.544" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="70.174" y="984.134" fill="#000" font-size="14" textLength="260.567" font-family="Noto Sans CJK JP">13. 設定時間に従ってイベントを実行し、</text><text x="70.174" y="1004.406" fill="#000" font-size="14" textLength="139.999" font-family="Noto Sans CJK JP">時系列指標を記録する</text><rect x="123.174" y="1043.574" width="154.567" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="133.174" y="1069.814" fill="#000" font-size="14" textLength="134.567" font-family="Noto Sans CJK JP">14. 集計値を確定する</text><rect x="130.174" y="1103.846" width="140.567" height="40.272" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="4" ry="4"/><text x="140.174" y="1130.086" fill="#000" font-size="14" textLength="120.567" font-family="Noto Sans CJK JP">15. 結果を出力する</text><ellipse cx="200.457" cy="1187.118" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="200.457" cy="1187.118" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="200.457" y1="166.816" x2="200.457" y2="186.816" style="stroke:#475569;stroke-width:1;"/><polygon points="196.457,176.816,200.457,186.816,204.457,176.816,200.457,180.816" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miter