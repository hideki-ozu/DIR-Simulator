="304.904" y="748.064" fill="#000" font-size="13" textLength="236.366" font-family="Noto Sans CJK JP">現bytesとbefore/afterを照合する復旧へ</text><polygon points="281.006,826.632,293.006,838.632,281.006,850.632,269.006,838.632,281.006,826.632" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="581.27" y="437.216" width="228" height="57.648" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="591.27" y="462.296" fill="#000" font-size="13" textLength="104" font-family="Noto Sans CJK JP">競合・許可エラー</text><text x="591.27" y="481.12" fill="#000" font-size="13" textLength="208" font-family="Noto Sans CJK JP">出力を書き換えず内部モデルを維持</text><polygon points="488.138,856.632,500.138,868.632,488.138,880.632,476.138,868.632,488.138,856.632" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="839.27" y="325.568" width="202" height="57.648" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="849.27" y="350.648" fill="#000" font-size="13" textLength="91" font-family="Noto Sans CJK JP">検証診断を表示</text><text x="849.27" y="369.472" fill="#000" font-size="13" textLength="182" font-family="Noto Sans CJK JP">出力・復旧記録を書き込まない</text><polygon points="714.204,886.632,726.204,898.632,714.204,910.632,702.204,898.632,714.204,886.632" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M745.204,920.632 L745.204,949.868 L725.204,953.868 L745.204,957.868 L745.204,987.104 A0,0 0 0 0 745.204,987.104 L1013.204,987.104 A0,0 0 0 0 1013.204,987.104 L1013.204,930.632 L1003.204,920.632 L745.204,920.632 A0,0 0 0 0 745.204,920.632" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1003.204,920.632 L1003.204,930.632 L1013.204,930.632 L1003.204,920.632" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="751.204" y="940.712" fill="#000" font-size="13" textLength="23