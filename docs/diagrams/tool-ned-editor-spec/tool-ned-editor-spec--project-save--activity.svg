igest一致?</text><text x="598.068" y="299.824" fill="#000" font-size="13" textLength="26" font-family="Noto Sans CJK JP">はい</text><text x="804.341" y="299.824" fill="#000" font-size="13" textLength="39" font-family="Noto Sans CJK JP">いいえ</text><rect x="393.638" y="325.568" width="189" height="57.648" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="403.638" y="350.648" fill="#000" font-size="13" textLength="169" font-family="Noto Sans CJK JP">選択した出力先の基準を確認</text><text x="403.638" y="369.472" fill="#000" font-size="13" textLength="142.376" font-family="Noto Sans CJK JP">出力lock取得後に再確認</text><polygon points="385.964,403.216,590.312,403.216,602.312,415.216,590.312,427.216,385.964,427.216,373.964,415.216,385.964,403.216" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="385.964" y="420.884" fill="#000" font-size="13" textLength="204.347" font-family="Noto Sans CJK JP">許可・確認値・hash・集合が一致?</text><text x="347.964" y="411.472" fill="#000" font-size="13" textLength="26" font-family="Noto Sans CJK JP">はい</text><text x="602.312" y="411.472" fill="#000" font-size="13" textLength="39" font-family="Noto Sans CJK JP">いいえ</text><rect x="138.516" y="437.216" width="284.979" height="57.648" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="148.516" y="462.296" fill="#000" font-size="13" textLength="264.979" font-family="Noto Sans CJK JP">before/after blobs・target登録・manifestを</text><text x="148.516" y="481.12" fill="#000" font-size="13" textLength="118.417" font-family="Noto Sans CJK JP">専用状態領域でsync</text><rect x="171.952" y="514.864" width="218.107" height="57.648" fill="#EFF6FF" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="181.952" y="539.944" fill="#000" font-size="13" textLength="198.107" font-family="Noto Sans CJK JP">出力directory・一時ファイル作成</text><text x="181.952" y="558.768" fill="#000" font-size="13" textLength="193.869" font-fa