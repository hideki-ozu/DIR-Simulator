site_name: DIR Simulator ガイド
site_description: CAN・Ethernet・メモリとIPCを実行し、結果を読み、条件を変えて理解するガイド
site_url: https://hideki-ozu.github.io/DIR-Simulator/
docs_dir: docs/guide
site_dir: build/guide
use_directory_urls: false
theme:
  name: mkdocs
  locale: ja
  highlightjs: false
nav:
  - ガイドの入口: index.md
  - 入門:
      - 初めてのCAN実行: 初めてのCAN実行.md
  - 画面操作:
      - Viewerで結果を読む: Viewerで結果を読む.md
  - 機能辞典と実験:
      - CANの調停: CANの調停.md
      - CANの受信フィルタ: CANの受信フィルタ.md
      - CAN受信処理遅延の比較: CAN受信処理遅延の比較.md
      - CAN FDのデータ速度比較: CANFDのデータ速度比較.md
      - Ethernet配送期限と遅延判定の比較: Ethernet配送期限と遅延判定の比較.md
      - Gateway処理遅延と複数CANバスの中継: Gateway処理遅延と複数CANバスの中継.md
      - SRAMのポート数と読み出し待ち時間: SRAMのポート数と読み出し待ち時間.md
      - メールボックスの容量と満杯応答: メールボックスの容量と満杯応答.md
      - DMAのコピー完了と通知待ち: DMAのコピー完了と通知待ち.md
      - DDRのリフレッシュと読み出し待ち: DDRのリフレッシュと読み出し待ち.md
      - AXIの書き込みストローブと部分更新: AXIの書き込みストローブと部分更新.md
      - 共有メモリの公開と取得権限: 共有メモリの公開と取得権限.md
      - SoC共有バスの調停と要求の待ち時間: SoC共有バスの調停と要求の待ち時間.md
      - AHBの応答待ちとERROR完了: AHBの応答待ちとERROR完了.md
      - NoCの入力FIFO容量と待ち時間: NoCの入力FIFO容量と待ち時間.md
      - Ethernetの優先キューと送信順: Ethernetの優先キューと送信順.md
      - EthernetのVLAN受入条件と破棄理由: EthernetのVLAN受入条件と破棄理由.md
      - Ethernet TASの送信窓とIFG込みの待ち時間: Ethernet TASの送信窓とIFG込みの待ち時間.md
      - Ethernetの静的multicastとコピーの配送先: Ethernetの静的multicastとコピーの配送先.md
      - Ethernet CBSのcredit回復と送信待ち: Ethernet CBSのcredit回復と送信待ち.md
      - Ethernet PSFPの色判定とyellow破棄: Ethernet PSFPの色判定とyellow破棄.md
      - EthernetのMAC学習とagingによる転送先: EthernetのMAC学習とagingによる転送先.md
      - Ethernetのlink復旧時刻と受信判定: Ethernetのlink復旧時刻と受信判定.md
      - Ethernetの源別multicastとINCLUDE・EXCLUDE: Ethernetの源別multicastとINCLUDE・EXCLUDE.md
  - 設定・用語・FAQ: 設定・用語・FAQ.md
  - ライセンス表示: ガイドのライセンス表示.md
plugins:
  - search:
      lang: [ja]
      min_search_length: 2
extra_css:
  - assets/guide.css
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
