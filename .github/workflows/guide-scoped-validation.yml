name: Guide scoped validation
# Eligibility evidence for the writer only. Never require this scoped check
# across main: ordinary code/admin/other-author PRs use general quality gates.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  validate:
    # Static lock: activation requires a separately approved main change.
    if: ${{ false }}
    name: Guide scoped validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install trusted-base validation dependencies
        run: python -m pip install -r requirements-guide.txt -r .github/requirements-guide-merge.txt
      - name: Build trusted-base simulator
        run: cargo build --locked -p dir-simulator
      - name: Validate data-only PR overlay
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/guide_merge_validate.py --pr "$PR_NUMBER" --trusted-sha "$TRUSTED_SHA" --binary target/debug/dir-simulator
