name: Documentation integrity tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-tests:
    # Keep the existing required-check context until a separately approved
    # ruleset migration. This job runs real shared documentation checks.
    name: Disabled policy unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout for isolated tests only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test existing traceability generator and staged snapshot hook
        run: python -m unittest discover -s tests -p 'test_*traceability*.py' -v
      - name: Check complete traceability paths
        run: python scripts/check_traceability.py --strict
      - name: Check generated reports and hierarchy freshness
        run: python scripts/generate_traceability.py --check
