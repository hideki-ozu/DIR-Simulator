name: Release audit regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'docs/proposals/fixtures/**'
      - 'examples/network-extensions/**'
      - 'examples/ethernet-wire/**'
      - 'examples/control-checkpoint/**'
      - 'docs/third-party/**'
      - 'docs/guide/assets/licenses/**'
      - 'scripts/check_third_party_notices.py'
      - 'scripts/verify_capacity_comparisons_viewer.cjs'
      - 'scripts/verify_issue121_capture_workflow.py'
      - 'docs/verification/results/ethernet-beb-seed/**'
      - 'docs/verification/results/axi-outstanding/**'
      - 'docs/verification/results/ethernet-cbs-gate/**'
      - 'docs/verification/results/gateway-rx-capacity/**'
      - 'docs/verification/results/release-native-distribution-audit-2026-10-08/**'
      - '.github/workflows/release-audit.yml'
      - 'tests/viewer_model.test.cjs'
      - 'tests/controlled_viewer_*.cjs'
      - 'tests/fixtures/controlled-rewind.json'
      - 'tests/viewer_browser.cjs'
      - 'tests/viewer_fixtures.cjs'
      - 'tests/network_viewer_model.test.cjs'
      - 'tests/network_viewer_browser.cjs'
      - 'tests/ned_editor_*.cjs'

permissions:
  contents: read

jobs:
  rust:
    name: Rust ledger identity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          set-safe-directory: false
      - name: Install fixed toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Format and regression
        run: |
          uname -a
          cat /etc/os-release
          rustc -Vv
          cargo --version
          git rev-parse HEAD
          git status --short
          sha256sum Cargo.lock crates/dir-simulator/tests/registry.rs crates/dir-simulator/src/lib.rs crates/dir-simulator/src/main.rs crates/dir-simulator/src/runtime.rs crates/dir-simulator/src/runtime/engine.rs crates/dir-simulator/src/cli_runtime_boundary_tests.rs
          cargo fmt --all -- --check
          cargo test --locked -p dir-simulator --test registry generic_channel_factories_receive_frozen_inputs_in_stable_order -- --exact --nocapture
          cargo test --locked -p dir-simulator --test registry generic_invalid_channel_parameter_never_reaches_factories -- --exact --nocapture
          cargo test --locked -p dir-simulator --test registry generic_channel_factory_failure_releases_only_constructed_prefix -- --exact --nocapture
          cargo test --locked -p dir-simulator --lib cli_runtime_boundary_tests::cli_validate_does_not_enter_runtime_and_run_positive_control_does -- --exact --nocapture
          cargo test --locked -p dir-simulator --test ac0008_paths classical_can_cli_validate_accepts_fixture_and_rejects_missing_config -- --exact --nocapture
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify actual product ledger reference
        id: native-product
        run: |
          cargo build --locked -p dir-simulator
          target/debug/dir-simulator run --config docs/verification/fixtures/can/competition.ini --output "$RUNNER_TEMP/ledger-metadata"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'ledger-metadata'
          result = json.loads((output / 'results.json').read_text())
          manifest = json.loads((output / 'manifest.json').read_text())
          ledger = Path('docs/third-party/採用物台帳.md').read_bytes()
          metadata = result['metadata']
          assert metadata['adoption_ledger_sha256'] == hashlib.sha256(ledger).hexdigest()
          assert metadata['adoption_ledger_version'] == re.search(r'文書バージョン：`([^`]+)`', ledger.decode('utf-8')).group(1)
          assert metadata['implementation_coverage']['reproduction_conditions'] == 'identified'
          assert manifest['metadata_ref'] == 'results.json#/metadata'
          for entry in manifest['files']:
              data = (output / entry['name']).read_bytes()
              assert len(data) == int(entry['bytes'])
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
          print('PASS: actual ledger hash/document version, metadata reference and manifest files')
          PY
          # Includes native fault/resource/cancellation/restart tests. Keep them
          # serial and separate from ordinary libtests' process-local fixtures.
          # ubuntu-24.04 may deny unprivileged uid_map. Use sudo only to
          # create/enter the private mount namespace; the test drops back to
          # the runner identity with no groups/capabilities before execution.
          DIR_ACCEPTANCE_NAMESPACE_MODE=sudo-mount DIR_NED_RUN_TEST_BINARY="$PWD/target/debug/dir-simulator" cargo test --locked -p dir-simulator --lib tool::ned_editor::run_control -- --ignored --nocapture --test-threads=1
      - name: Startup observer regressions
        run: |
          node --test tests/ned_editor_startup.test.cjs
          DIR_NED_HTTP_BINARY="$PWD/target/debug/dir-simulator" node --test tests/ned_editor_startup_failure.test.cjs
      - name: Native HTTP acceptance
        run: |
          DIR_NED_HTTP_BINARY="$PWD/target/debug/dir-simulator" node --test tests/ned_editor_acceptance_http.test.cjs
      - name: Native shutdown acceptance
        if: ${{ !cancelled() && steps.native-product.conclusion == 'success' }}
        run: |
          DIR_NED_RUN_TEST_BINARY="$PWD/target/debug/dir-simulator" node --test tests/ned_editor_run_shutdown.test.cjs
      - name: Viewer model and browser regression
        if: ${{ !cancelled() && steps.native-product.conclusion == 'success' }}
        run: |
          node --version
          npm --version
          npm install --prefix "$RUNNER_TEMP/viewer-tests" --no-package-lock --no-save playwright@1.64.0
          "$RUNNER_TEMP/viewer-tests/node_modules/.bin/playwright" install --with-deps chromium
          DIR_SIMULATOR_BIN="$PWD/target/debug/dir-simulator" node --test tests/network_viewer_model.test.cjs
          node --test tests/viewer_model.test.cjs tests/controlled_viewer_model.test.cjs
          NODE_PATH="$RUNNER_TEMP/viewer-tests/node_modules" node tests/viewer_browser.cjs
          mkdir "$RUNNER_TEMP/network-viewer"
          node - "$RUNNER_TEMP/network-viewer/can-detail-states.json" <<'JS'
          const fs = require('node:fs');
          const {canDetailStatesFixture} = require('./tests/network_viewer_model.test.cjs');
          fs.writeFileSync(process.argv[2], JSON.stringify(canDetailStatesFixture()));
          JS
          NODE_PATH="$RUNNER_TEMP/viewer-tests/node_modules" node tests/network_viewer_browser.cjs "$RUNNER_TEMP/network-viewer/can-detail-states.json"
          network_viewer_args=()
          for network_viewer_name in r01 r02 fanout native-multicast-lineages fanout-unadmittable; do
            network_viewer_output="$RUNNER_TEMP/network-viewer/$network_viewer_name"
            network_viewer_results="$network_viewer_output/results.json"
            network_viewer_html="$RUNNER_TEMP/network-viewer/$network_viewer_name.html"
            target/debug/dir-simulator run --config "docs/verification/fixtures/acceptance-2026-10-08/bridge/$network_viewer_name/run.ini" --output "$network_viewer_output"
            target/debug/dir-simulator view --input "$network_viewer_results" --output "$network_viewer_html"
            network_viewer_args+=("$network_viewer_results" "$network_viewer_html")
          done
          NODE_PATH="$RUNNER_TEMP/viewer-tests/node_modules" node tests/network_viewer_browser.cjs --exported-html "${network_viewer_args[@]}"
          node --test tests/ned_editor_ui.test.cjs tests/ned_editor_recovery.test.cjs tests/ned_editor_extensions_ui.test.cjs
          NODE_PATH="$RUNNER_TEMP/viewer-tests/node_modules" node --test tests/ned_editor_viewer_expiry_browser.test.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-tests/node_modules/playwright" DIR_SIMULATOR_BIN="$PWD/target/debug/dir-simulator" node --test tests/ned_editor_extensions_browser.test.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-tests/node_modules/playwright" DIR_SIMULATOR_BIN="$PWD/target/debug/dir-simulator" node --test tests/ned_editor_hostile_browser.test.cjs
      - name: Capture published guide comparison viewers
        if: ${{ !cancelled() && steps.native-product.conclusion == 'success' }}
        run: |
          measurement_root="$PWD/docs/verification/results"
          capture_script="$PWD/scripts/verify_capacity_comparisons_viewer.cjs"
          node_modules="${NODE_PATH:-$RUNNER_TEMP/viewer-tests/node_modules}"

          all_output="$RUNNER_TEMP/guide-captures-all"
          NODE_PATH="$node_modules" node "$capture_script" "$measurement_root" --output "$all_output"

          axi_root="$RUNNER_TEMP/guide-capture-inputs-axi"
          mkdir -p "$axi_root"
          cp -a "$measurement_root/axi-outstanding" "$axi_root/"
          axi_output="$RUNNER_TEMP/guide-captures-axi"
          NODE_PATH="$node_modules" node "$capture_script" "$axi_root" --only axi-outstanding --output "$axi_output"

          gateway_root="$RUNNER_TEMP/guide-capture-inputs-gateway"
          mkdir -p "$gateway_root"
          cp -a "$measurement_root/gateway-rx-capacity" "$gateway_root/"
          gateway_output="$RUNNER_TEMP/guide-captures-gateway"
          NODE_PATH="$node_modules" node "$capture_script" "$gateway_root" --only gateway-rx-capacity --output "$gateway_output"

          assert_existing_output_refused() {
            local input_root="$1"
            local output_root="$2"
            local selection="$3"
            local log="$RUNNER_TEMP/guide-capture-refused-$(basename "$output_root").log"
            local -a args=("$input_root")
            if [[ -n "$selection" ]]; then
              args+=(--only "$selection")
            fi
            if NODE_PATH="$node_modules" node "$capture_script" "${args[@]}" --output "$output_root" >"$log" 2>&1; then
              cat "$log"
              printf 'ERROR: helper accepted existing output %s\n' "$output_root" >&2
              exit 1
            fi
            grep -F 'refuse existing capture output:' "$log"
          }
          assert_existing_output_refused "$measurement_root" "$all_output" ''
          assert_existing_output_refused "$axi_root" "$axi_output" 'axi-outstanding'
          assert_existing_output_refused "$gateway_root" "$gateway_output" 'gateway-rx-capacity'

          git diff --exit-code -- docs/guide/assets docs/verification/results
      - name: Extension Viewer exports and process checkpoint example
        if: ${{ !cancelled() && steps.native-product.conclusion == 'success' }}
        run: |
          cargo build --locked -p dir-simulator --bin dir-simulator --example control_checkpoint
          mkdir "$RUNNER_TEMP/extension-viewer"
          for name in composite redundancy preemption; do
            target/debug/dir-simulator run --config "examples/network-extensions/$name.ini" --output "$RUNNER_TEMP/extension-viewer/$name"
            target/debug/dir-simulator view --input "$RUNNER_TEMP/extension-viewer/$name/results.json" --output "$RUNNER_TEMP/extension-viewer/$name.html"
          done
          for name in active passive; do
            target/debug/dir-simulator run --config "examples/ethernet-wire/$name.ini" --output "$RUNNER_TEMP/extension-viewer/$name"
            target/debug/dir-simulator view --input "$RUNNER_TEMP/extension-viewer/$name/results.json" --output "$RUNNER_TEMP/extension-viewer/$name.html"
          done
          target/debug/examples/control_checkpoint save examples/control-checkpoint/scenario.ini "$RUNNER_TEMP/extension-viewer/control"
          target/debug/examples/control_checkpoint restore "$RUNNER_TEMP/extension-viewer/control"
          target/debug/dir-simulator view --input "$RUNNER_TEMP/extension-viewer/control/paused/results.json" --output "$RUNNER_TEMP/extension-viewer/paused.html"
          target/debug/dir-simulator view --input "$RUNNER_TEMP/extension-viewer/control/restored/results.json" --output "$RUNNER_TEMP/extension-viewer/restored.html"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-tests/node_modules/playwright" node tests/controlled_viewer_browser.cjs \
            "$RUNNER_TEMP/extension-viewer/composite/results.json" "$RUNNER_TEMP/extension-viewer/composite.html" \
            "$RUNNER_TEMP/extension-viewer/redundancy/results.json" "$RUNNER_TEMP/extension-viewer/redundancy.html" \
            "$RUNNER_TEMP/extension-viewer/preemption/results.json" "$RUNNER_TEMP/extension-viewer/preemption.html" \
            "$RUNNER_TEMP/extension-viewer/active/results.json" "$RUNNER_TEMP/extension-viewer/active.html" \
            "$RUNNER_TEMP/extension-viewer/passive/results.json" "$RUNNER_TEMP/extension-viewer/passive.html" \
            "$RUNNER_TEMP/extension-viewer/control/paused/results.json" "$RUNNER_TEMP/extension-viewer/paused.html" \
            "$RUNNER_TEMP/extension-viewer/control/restored/results.json" "$RUNNER_TEMP/extension-viewer/restored.html"
      - name: Audit checker and comparison selftests
        if: ${{ !cancelled() && steps.native-product.conclusion == 'success' }}
        run: |
          python3 scripts/check_third_party_notices.py
          cd docs/verification/results/release-native-distribution-audit-2026-10-08
          python3 verify_release_audit.py
          python3 native_correctness.py selftest
