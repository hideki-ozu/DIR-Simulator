name: Disabled scoped guide writer

on:
  workflow_run:
    workflows: [Guide scoped validation]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: guide-scoped-writer
  cancel-in-progress: false

jobs:
  writer:
    # No writer job/token can run, regardless of repository variables or events.
    # Remove this lock only in an individually approved activation PR.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      pull-requests: read
      checks: read
    steps:
      - name: Checkout trusted main event SHA only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Recollect every guard and conditionally write
        env:
          GH_TOKEN: ${{ github.token }}
          GUIDE_SCOPED_MERGE_ENABLED: ${{ vars.GUIDE_SCOPED_MERGE_ENABLED }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TRUSTED_SHA: ${{ github.sha }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: python scripts/guide_merge_runtime.py --pr "$PR_NUMBER" --trusted-sha "$TRUSTED_SHA" --trigger-run "$TRIGGER_RUN" --write
